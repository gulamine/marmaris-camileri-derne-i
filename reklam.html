<div class="header">
<div class="container">
<div class="card">

<h1>💼 Reklam & Sponsor Başvuru</h1>
<p>Reklam vermek veya sponsor olmak için bilgilerinizi girin</p>

<form onsubmit="gonder(event)">

<input type="text" id="isim" placeholder="Ad Soyad / Firma Adı" required>

<input type="text" id="telefon" placeholder="Telefon" required>

<input type="text" id="dukkan" placeholder="Dükkan / İşletme Adı">

<input type="text" id="adres" placeholder="Adres">

<input type="text" id="website" placeholder="Web Sitesi (varsa)">

<input type="text" id="instagram" placeholder="Instagram (varsa)">

<textarea id="mesaj" placeholder="Reklam detayını yazın..." required></textarea>

<button type="submit">Başvuru Gönder</button>

</form>

<a id="waBtn" class="whatsapp" target="_blank">
📱 WhatsApp'tan Yaz
</a>

</div>
</div>

<script>
function gonder(e){
    e.preventDefault();

    let isim = document.getElementById("isim").value;
    let tel = document.getElementById("telefon").value;
    let dukkan = document.getElementById("dukkan").value;
    let adres = document.getElementById("adres").value;
    let web = document.getElementById("website").value;
    let insta = document.getElementById("instagram").value;
    let mesaj = document.getElementById("mesaj").value;

    let text =
    "📢 REKLAM BAŞVURUSU %0A%0A" +
    "👤 İsim: " + isim + "%0A" +
    "📞 Telefon: " + tel + "%0A" +
    "🏪 İşletme: " + dukkan + "%0A" +
    "📍 Adres: " + adres + "%0A" +
    "🌐 Web: " + web + "%0A" +
    "📷 Instagram: " + insta + "%0A%0A" +
    "📝 Mesaj: " + mesaj;

    let numara = "905325695040"; // BURAYI DEĞİŞTİR

    window.open("https://wa.me/" + numara + "?text=" + text);
}

// Direkt WhatsApp butonu
document.getElementById("waBtn").href =
"https://wa.me/905312345678?text=Merhaba%20reklam%20vermek%20istiyorum";
</script>
